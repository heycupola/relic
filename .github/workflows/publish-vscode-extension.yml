name: Publish VS Code Extension

on:
  push:
    branches: [main]
    paths:
      - "apps/vscode-extension/**"
      - ".github/workflows/publish-vscode-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-vscode-extension
  cancel-in-progress: false

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    outputs:
      changed: ${{ steps.version.outputs.changed }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check if the extension version changed
        id: version
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./apps/vscode-extension/package.json').version")
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git cat-file -e "HEAD~1:apps/vscode-extension/package.json" 2>/dev/null; then
            PREVIOUS=$(git show "HEAD~1:apps/vscode-extension/package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).version))")
          else
            PREVIOUS="0.0.0"
          fi

          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        if: steps.version.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: bun install --frozen-lockfile

      - name: Package the extension
        if: steps.version.outputs.changed == 'true'
        working-directory: apps/vscode-extension
        run: bun run package

      - name: Reject unexpected package contents
        if: steps.version.outputs.changed == 'true'
        working-directory: apps/vscode-extension
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          import zipfile

          allowed = {
              "extension.vsixmanifest",
              "[Content_Types].xml",
              "extension/changelog.md",
              "extension/LICENSE.txt",
              "extension/readme.md",
              "extension/package.json",
              "extension/images/icon.png",
              "extension/dist/extension.js",
          }
          with zipfile.ZipFile("relic-vscode.vsix") as archive:
              names = set(archive.namelist())
          extra = sorted(names - allowed)
          missing = sorted(allowed - names)
          if extra or missing:
              print("VSIX contents do not match the publish allowlist.")
              for name in extra:
                  print(f"extra: {name}")
              for name in missing:
                  print(f"missing: {name}")
              sys.exit(1)
          PY

      - name: Upload the package
        if: steps.version.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: relic-vscode
          path: apps/vscode-extension/relic-vscode.vsix
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && needs.package.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install publish tools
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: relic-vscode
          path: apps/vscode-extension

      - name: Publish to Marketplace and Open VSX
        working-directory: apps/vscode-extension
        run: |
          set -euo pipefail
          status=0
          bunx vsce publish --packagePath relic-vscode.vsix --no-dependencies --skip-duplicate --oidc || status=1
          bunx ovsx publish --packagePath relic-vscode.vsix --skip-duplicate --trusted-publishing || status=1
          exit "$status"
